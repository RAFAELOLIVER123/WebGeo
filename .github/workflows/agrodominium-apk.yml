name: AgroDominium Android APK

on:
  push:
    branches: [agrodominium-apk-build]
    paths:
      - 'android-build/**'
      - 'v3src_payload/**'
      - 'v33_overlay/**'
      - 'v34_overlay/**'
      - 'v35_overlay/**'
      - '.github/workflows/agrodominium-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore full V3 source
        shell: bash
        run: |
          cat v3src_payload/part00.b64 v3src_payload/part01.b64 v3src_payload/rest00.b64 v3src_payload/rest01.b64 v3src_payload/rest02.b64 v3src_payload/rest03.b64 v3src_payload/rest04.b64 v3src_payload/rest05.b64 | base64 -d > /tmp/v3_source.tgz
          echo "70ee2dcc439b7aac2a66e022d22feae4d3a327bf4c0c0b80e30f6877bf3379c8  /tmp/v3_source.tgz" | sha256sum -c -
          rm -rf android-build/app
          tar -xzf /tmp/v3_source.tgz -C android-build

      - name: Apply V3.3 realtime overlay
        shell: bash
        run: |
          cat v33_overlay/part00.b64 v33_overlay/part01a.b64 v33_overlay/part01b.b64 v33_overlay/part02.b64 v33_overlay/part03a.b64 v33_overlay/part03b.b64 | base64 -d > /tmp/v33_overlay.tgz
          echo "9064fa395ed0ed5caadff60d94f390e9044bbb0a1d1c32a786c220ad9958d2ea  /tmp/v33_overlay.tgz" | sha256sum -c -
          rm -rf /tmp/v33overlay && mkdir -p /tmp/v33overlay
          tar -xzf /tmp/v33_overlay.tgz -C /tmp/v33overlay
          cd android-build && patch -p1 < /tmp/v33overlay/v33.patch && cd ..
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android-build/app/src/main/res/mipmap-$d"
            cp /tmp/v33overlay/icon.png "android-build/app/src/main/res/mipmap-$d/ic_launcher.png"
            cp /tmp/v33overlay/icon.png "android-build/app/src/main/res/mipmap-$d/ic_launcher_round.png"
          done

      - name: Apply V3.4 full overlay
        shell: bash
        run: |
          cat v34_overlay/full00.b64 v34_overlay/full01.b64 v34_overlay/full02_03.b64 v34_overlay/full04_05.b64 v34_overlay/full06_07.b64 v34_overlay/full08.b64 v34_overlay/full09.b64 v34_overlay/full10.b64 v34_overlay/full11.b64 v34_overlay/full12.b64 v34_overlay/full13.b64 | base64 -d > /tmp/v34_overlay_full.tgz
          echo "c37fdd2d8cf9469875101b47f77bdf31d2835d2c23b92054218a64b523b947c5  /tmp/v34_overlay_full.tgz" | sha256sum -c -
          tar -xzf /tmp/v34_overlay_full.tgz -C android-build

      - name: Apply V3.5 overlay
        shell: bash
        run: |
          cat v35_overlay/part0a.b64 v35_overlay/part0b.b64 v35_overlay/part1a.b64 v35_overlay/part1b.b64 v35_overlay/part2.b64 v35_overlay/part3.b64 | base64 -d > /tmp/v35_patch_bundle.tgz
          echo "923e99399f72ea6a82edad9d18af0c80b03395cb34a9272dd4d990751d4b9491  /tmp/v35_patch_bundle.tgz" | sha256sum -c -
          rm -rf /tmp/v35patch && mkdir -p /tmp/v35patch
          tar -xzf /tmp/v35_patch_bundle.tgz -C /tmp/v35patch
          cd android-build && patch -p1 < /tmp/v35patch/v35.patch && cd ..

      - name: Apply V3.5.1 stability hotfix
        run: |
          python3 v35_overlay/apply_v351.py
          grep -q "V3.5.1 — estabilidade" android-build/app/src/main/assets/app/app-v3.js

      - name: Apply V3.5.2 chat and download hotfix
        run: |
          python3 v35_overlay/apply_v352.py
          grep -q "V3.5.2 — chat mobile" android-build/app/src/main/assets/app/app-v3.js
          grep -q "downloadChatFile(String id,String mode)" android-build/app/src/main/java/com/agrodominium/mobile/v3/MainActivity.java

      - name: Apply V3.5.3 confirmed pull hotfix
        run: |
          python3 v35_overlay/apply_v353.py
          grep -q "V3.5.3 — pull confirmado" android-build/app/src/main/assets/app/app-v3.js
          grep -q "mergeChatDirectory353" android-build/app/src/main/java/com/agrodominium/mobile/v3/MainActivity.java
          grep -q "base não foi baixada" android-build/app/src/main/java/com/agrodominium/mobile/v3/SyncCore.java
          grep -q "versionName '3.5.3'" android-build/app/build.gradle

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: android-build
        run: gradle :app:assembleDebug --stacktrace

      - name: Validate V3.5.3 APK
        shell: bash
        run: |
          APK=android-build/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          ENTRIES=$(unzip -Z1 "$APK" | wc -l)
          echo "APK bytes: $SIZE"
          echo "APK entries: $ENTRIES"
          unzip -p "$APK" assets/app/app-v3.js | grep -q "V3.5.3 — pull confirmado"
          unzip -l "$APK" | grep -E 'classes([0-9]+)?[.]dex'
          unzip -l "$APK" | grep -E 'mipmap-.*/ic_launcher.png'
          test "$SIZE" -gt 1000000
          test "$ENTRIES" -gt 50
          cp "$APK" AgroDominium_Android_V3_5_3.apk
          sha256sum AgroDominium_Android_V3_5_3.apk > AgroDominium_Android_V3_5_3.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgroDominium_Android_V3_5_3
          path: |
            AgroDominium_Android_V3_5_3.apk
            AgroDominium_Android_V3_5_3.sha256
          retention-days: 30
