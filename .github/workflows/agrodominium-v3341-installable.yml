name: AgroDominium V3.3.4.1 Installable

on:
  push:
    branches: [agrodominium-apk-build]
    paths:
      - '.github/workflows/agrodominium-v3341-installable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restaurar V3.3 estavel
        shell: bash
        run: |
          set -euo pipefail
          cat v3src_payload/part00.b64 v3src_payload/part01.b64 v3src_payload/rest00.b64 v3src_payload/rest01.b64 v3src_payload/rest02.b64 v3src_payload/rest03.b64 v3src_payload/rest04.b64 v3src_payload/rest05.b64 | base64 -d > /tmp/v3_source.tgz
          echo "70ee2dcc439b7aac2a66e022d22feae4d3a327bf4c0c0b80e30f6877bf3379c8  /tmp/v3_source.tgz" | sha256sum -c -
          rm -rf android-build/app
          tar -xzf /tmp/v3_source.tgz -C android-build
          cat v33_overlay/part00.b64 v33_overlay/part01a.b64 v33_overlay/part01b.b64 v33_overlay/part02.b64 v33_overlay/part03a.b64 v33_overlay/part03b.b64 | base64 -d > /tmp/v33_overlay.tgz
          echo "9064fa395ed0ed5caadff60d94f390e9044bbb0a1d1c32a786c220ad9958d2ea  /tmp/v33_overlay.tgz" | sha256sum -c -
          rm -rf /tmp/v33overlay && mkdir -p /tmp/v33overlay
          tar -xzf /tmp/v33_overlay.tgz -C /tmp/v33overlay
          cd android-build
          patch -p1 < /tmp/v33overlay/v33.patch
          cd ..
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android-build/app/src/main/res/mipmap-$d"
            cp /tmp/v33overlay/icon.png "android-build/app/src/main/res/mipmap-$d/ic_launcher.png"
            cp /tmp/v33overlay/icon.png "android-build/app/src/main/res/mipmap-$d/ic_launcher_round.png"
          done

      - name: Aplicar V3.3.2 integrada
        shell: bash
        run: |
          set -euo pipefail
          cat v332_integrated/part00.b64 v332_integrated/part01.b64 > /tmp/v332.patch.gz.b64
          echo "18fb1eac3af29f3522dc3e32c426c6e93df3fddc68da66f94893b701a0553a2c  /tmp/v332.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/v332.patch.gz.b64 > /tmp/v332.patch.gz
          echo "a91d2757999d5806d7a598face33385312166961de4f3cccc80439c28081fe68  /tmp/v332.patch.gz" | sha256sum -c -
          gunzip -c /tmp/v332.patch.gz > /tmp/v332.patch
          echo "60538320fdc8edd2910067108e3a63e5178cceacfe80047bad1c8571519f0a57  /tmp/v332.patch" | sha256sum -c -
          cd android-build
          patch -p2 < /tmp/v332.patch
          cd ..

      - name: Aplicar V3.3.4 integrada
        shell: bash
        run: |
          set -euo pipefail
          cat v334_integrated/part00.b64 v334_fixed/p01_00.b64 v334_fixed/p01_01.b64 v334_fixed/p01_02.b64 v334_fixed/p01_03.b64 v334_fixed/p01_04.b64 v334_fixed/p01_05.b64 v334_fixed/p01_06.b64 v334_integrated/part02.b64 > /tmp/v334.patch.gz.b64
          echo "a16fc54f92a6b493723083ba98f2d03f9a9dc7b1a1c9daf86fb43187a374ba70  /tmp/v334.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/v334.patch.gz.b64 > /tmp/v334.patch.gz
          echo "4a728a177c82f41a4577773cc149a02f6d809da66bd9c6628e7795a946e1833a  /tmp/v334.patch.gz" | sha256sum -c -
          gunzip -c /tmp/v334.patch.gz > /tmp/v334.patch
          echo "b53959db4057be58ebd76c59ad3673a7bdd83eaaf2e0743a1a67ce1c04bf52aa  /tmp/v334.patch" | sha256sum -c -
          cd android-build
          patch -p4 < /tmp/v334.patch
          cd ..

      - name: Corrigir instalacao Android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-build/app/build.gradle')
          s=p.read_text()
          import re
          s=re.sub(r"applicationId\s+'[^']+'", "applicationId 'com.agrodominium.mobile.v3341'", s)
          s=re.sub(r"versionCode\s+\d+", "versionCode 3341", s)
          s=re.sub(r"versionName\s+'[^']+'", "versionName '3.3.4.1'", s)
          p.write_text(s)
          m=Path('android-build/app/src/main/AndroidManifest.xml')
          ms=m.read_text()
          if 'android:installLocation=' not in ms:
              ms=ms.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android" android:installLocation="auto">')
          m.write_text(ms)
          PY
          grep -q "applicationId 'com.agrodominium.mobile.v3341'" android-build/app/build.gradle
          grep -q "versionCode 3341" android-build/app/build.gradle
          grep -q "versionName '3.3.4.1'" android-build/app/build.gradle
          grep -q 'android:authorities="${applicationId}.files"' android-build/app/src/main/AndroidManifest.xml
          echo "4c46fc6380a96ecccf1110025263257f0d5884e8151b926326a2a9cda9e671a3  android-build/app/src/main/java/com/agrodominium/mobile/v3/SyncCore.java" | sha256sum -c -

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK universal
        working-directory: android-build
        run: gradle :app:assembleDebug --stacktrace

      - name: Validar instalacao e assinatura
        shell: bash
        run: |
          set -euo pipefail
          APK=android-build/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "Build tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.agrodominium.mobile.v3341'" /tmp/badging.txt
          grep -q "sdkVersion:'21'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.agrodominium.mobile.v3.MainActivity'" /tmp/badging.txt
          SIZE=$(stat -c%s "$APK")
          ENTRIES=$(unzip -Z1 "$APK" | wc -l)
          test "$SIZE" -gt 1000000
          test "$ENTRIES" -gt 50
          cp "$APK" AgroDominium_Android_V3_3_4_1_Instalavel.apk
          sha256sum AgroDominium_Android_V3_3_4_1_Instalavel.apk > AgroDominium_Android_V3_3_4_1_Instalavel.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AgroDominium_Android_V3_3_4_1_Instalavel
          path: |
            AgroDominium_Android_V3_3_4_1_Instalavel.apk
            AgroDominium_Android_V3_3_4_1_Instalavel.sha256
          retention-days: 30
