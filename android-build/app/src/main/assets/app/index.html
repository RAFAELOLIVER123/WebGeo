<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AgroDominium</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f7f4;color:#153126}.top{height:62px;background:#0b6b3a;color:#fff;display:flex;align-items:center;padding:0 16px;position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:20px;flex:1}.chip{font-size:11px;padding:6px 9px;border-radius:20px;background:#fff;color:#0b6b3a;font-weight:700}.chip.off{background:#ffe7e7;color:#9b1c1c}.wrap{padding:14px 14px 84px}.hero{background:linear-gradient(135deg,#0b6b3a,#16834c);color:#fff;border-radius:20px;padding:20px;margin-bottom:14px}.hero h1{margin:0 0 5px;font-size:23px}.hero p{margin:0;opacity:.86;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat,.card{background:#fff;border:1px solid #deebe2;border-radius:16px;padding:13px}.stat b{display:block;font-size:20px;color:#0b6b3a}.stat span{font-size:10px;color:#63756d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{border:0;background:#fff;border:1px solid #deebe2;border-radius:18px;padding:16px;text-align:left;min-height:108px}.action i{font-style:normal;font-size:26px}.action b{display:block;margin-top:7px}.action small{color:#6b7a73}.title{font-size:16px;font-weight:800;margin:18px 2px 9px}.row{background:#fff;border:1px solid #deebe2;border-radius:14px;padding:12px;margin-bottom:8px}.row b{display:block}.row small{color:#6b7a73}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800;background:#0b6b3a;color:#fff}.btn.alt{background:#e6f1eb;color:#0b6b3a}.btn.bad{background:#a82020}.btn.full{width:100%}.field{display:block;margin:10px 0}.field span{display:block;font-size:11px;font-weight:700;margin-bottom:5px;color:#53665d}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #cfe0d6;border-radius:11px;background:#fff;font-size:15px}.field textarea{min-height:80px}.bottom{position:fixed;left:0;right:0;bottom:0;height:68px;background:#fff;border-top:1px solid #dbe8df;display:grid;grid-template-columns:repeat(5,1fr);z-index:10}.bottom button{border:0;background:none;font-size:10px;color:#66776e}.bottom button strong{display:block;font-size:20px;margin-bottom:3px}.login{position:fixed;inset:0;background:#eef5f0;z-index:30;display:flex;align-items:center;justify-content:center;padding:22px}.login.hide{display:none}.loginbox{width:100%;max-width:420px;background:#fff;border-radius:22px;padding:24px;box-shadow:0 18px 50px #15312622}.loginbox h1{color:#0b6b3a;margin:0 0 5px}.loginbox p{font-size:12px;color:#67776f}.muted{color:#6d7c75;font-size:12px}.ok{color:#0b6b3a}.warn{color:#9b5b00}.hide{display:none}.scroll{max-height:60vh;overflow:auto}.sample{font-size:12px;background:#eef7f2;border-radius:12px;padding:10px;margin:8px 0}.plantrow{display:grid;grid-template-columns:36px repeat(4,1fr);gap:4px;align-items:center;margin:5px 0}.plantrow input{width:100%;padding:8px 2px;border:1px solid #d5e3da;border-radius:8px;text-align:center}.manager{border-left:4px solid #0b6b3a}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><h1>AgroDominium</h1><p>Aplicativo de campo • offline-first</p><label class="field"><span>Usuário / matrícula / e-mail</span><input id="lg"></label><label class="field"><span>Senha</span><input id="pw" type="password"></label><button class="btn full" onclick="doLogin()">Entrar e baixar dados</button><p id="lmsg" class="muted"></p></div></div>
<div class="top"><div class="brand">AgroDominium</div><div id="net" class="chip">Online</div></div><main id="main" class="wrap"></main>
<nav class="bottom"><button onclick="home()"><strong>⌂</strong>Início</button><button onclick="programs()"><strong>▦</strong>Agenda</button><button onclick="producers()"><strong>♙</strong>Produtores</button><button onclick="estimate()"><strong>♧</strong>Estimativa</button><button onclick="sync()"><strong>↻</strong>Sync</button></nav>
<script>
var S={},B={},D={},Q=[];function p(s,d){try{return JSON.parse(s)}catch(e){return d}}function N(n){try{return AgroNative[n].apply(AgroNative,[].slice.call(arguments,1))}catch(e){return null}}function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function reload(){S=p(N('getState'),{});B=p(N('getSnapshot'),{});D=B.data||{};Q=p(N('getQueue'),[]);var n=document.getElementById('net');n.innerHTML=S.online?'Online':'Offline';n.className='chip'+(S.online?'':' off');document.getElementById('login').className='login'+(S.authenticated?' hide':'')}function mgr(){var r=((S.user||{}).perfil_codigo||'').toUpperCase();return ['SUPERVISOR','GERENTE','DIRETOR','ADMIN'].indexOf(r)>=0}function br(d){if(!d)return'—';var x=String(d).slice(0,10).split('-');return x.length===3?x[2]+'/'+x[1]+'/'+x[0]:d}function doLogin(){var m=document.getElementById('lmsg');m.innerHTML='Conectando...';N('login',document.getElementById('lg').value,document.getElementById('pw').value)}window.agroLoginResult=function(s){var r=p(s,{});document.getElementById('lmsg').innerHTML=r.ok?'Login realizado. Baixando a base...':esc(r.error||'Falha no login');if(r.ok){reload();home()}};window.agroBootstrapResult=function(s){var r=p(s,{});reload();if(!r.ok&&S.has_snapshot)toast('Sem internet: usando a base salva no aparelho.');home()};window.agroSyncResult=function(s){var r=p(s,{});reload();toast(r.message||r.error||'Sincronização concluída');sync()};window.agroQueueChanged=function(){reload()};function toast(t){alert(t)}
function home(){reload();if(!S.authenticated)return;var u=S.user||{},name=(u.nome||'Usuário').split(' ')[0],prod=(D.produtores||[]).length,pend=S.pending||0,prog=(D.programacoes||[]).length,role=mgr()?'Gestão':'Campo';var extra='';if(mgr())extra='<div class="title">Gestão</div><div class="grid"><button class="action" onclick="approvals()"><i>✓</i><b>Aprovações</b><small>Programações e checklists pendentes</small></button><button class="action" onclick="team()"><i>⌖</i><b>Equipe</b><small>Técnicos, atividades e posições baixadas</small></button></div>';else extra='<div class="title">Atalhos de campo</div><div class="grid"><button class="action" onclick="point()"><i>⌖</i><b>Registrar ponto</b><small>GPS e produtor, mesmo offline</small></button><button class="action" onclick="estimate()"><i>♧</i><b>Estimativa</b><small>Amostra automática de 10%</small></button></div>';document.getElementById('main').innerHTML='<section class="hero"><h1>'+role+' • Olá, '+esc(name)+'</h1><p>'+esc((u.perfil_nome||u.perfil_codigo||''))+' · '+(S.has_snapshot?'base offline disponível':'sincronize antes de sair para campo')+'</p></section><div class="stats"><div class="stat"><b>'+prod+'</b><span>Produtores</span></div><div class="stat"><b>'+prog+'</b><span>Programações</span></div><div class="stat"><b>'+pend+'</b><span>Pendentes</span></div></div>'+extra+'<div class="title">Dados no aparelho</div><div class="card"><b>'+(S.has_snapshot?'✓ Base baixada':'⚠ Sem base offline')+'</b><p class="muted">O aplicativo usa a cópia local quando não há internet. Nada da fila é apagado até o servidor confirmar o envio.</p><button class="btn alt" onclick="refresh()">Baixar dados agora</button></div>'}
function refresh(){if(!S.online)return toast('Sem internet. A base já salva continua disponível.');N('refreshData');toast('Baixando atualização...')}
function programs(){reload();var a=D.programacoes||[],html='<div class="title">Programações</div>';for(var i=0;i<Math.min(a.length,150);i++){var x=a[i];html+='<div class="row"><b>'+esc(x.atividade_nome||'Atividade')+'</b><small>'+br(x.data_programada)+' · '+esc(x.comunidade_nome||'')+' · '+esc(x.status||'')+(mgr()?' · '+esc(x.tecnico_nome||''):'')+'</small></div>'}if(!a.length)html+='<div class="card muted">Nenhuma programação na base local.</div>';document.getElementById('main').innerHTML=html}
function producers(){reload();var a=D.produtores||[];document.getElementById('main').innerHTML='<div class="title">Produtores</div><label class="field"><input id="pq" placeholder="Pesquisar produtor ou CPF" oninput="drawProd()"></label><div id="plist"></div>';drawProd()}function drawProd(){var q=(document.getElementById('pq').value||'').toLowerCase(),a=D.produtores||[],h='',n=0;for(var i=0;i<a.length&&n<200;i++){var x=a[i],t=((x.nome||'')+' '+(x.cpf||'')).toLowerCase();if(q&&t.indexOf(q)<0)continue;h+='<div class="row"><b>'+esc(x.nome||'Produtor')+'</b><small>'+esc(x.cpf||'CPF não informado')+' · '+esc(x.cidade||'')+'</small></div>';n++}document.getElementById('plist').innerHTML=h||'<div class="card muted">Nenhum produtor encontrado.</div>'}
var egps=null;function estimate(){reload();var opts='<option value="">Selecione</option>',a=D.produtores||[];for(var i=0;i<a.length;i++)opts+='<option value="'+i+'">'+esc(a[i].nome||'Produtor')+'</option>';document.getElementById('main').innerHTML='<div class="title">Nova estimativa</div><div class="card"><label class="field"><span>Produtor</span><select id="ep">'+opts+'</select></label><label class="field"><span>Total de plantas do plantio</span><input id="et" type="number" inputmode="numeric" oninput="sampleRows()"></label><div id="target" class="sample">Amostra 10%: informe o total de plantas.</div><label class="field"><span>Peso médio (kg)</span><input id="ew" type="number" step="0.01"></label><button class="btn alt" onclick="gpsEst()">⌖ Capturar GPS</button><div id="gpss" class="muted"></div><div id="rows" class="scroll"></div><label class="field"><span>Observação</span><textarea id="eo"></textarea></label><button class="btn full" onclick="saveEst()">Salvar offline para sincronizar</button></div>';}
function sampleRows(){var total=parseInt(document.getElementById('et').value||'0',10)||0,target=total?Math.ceil(total*.10):0;document.getElementById('target').innerHTML='Amostra 10%: <b>'+target+'</b> planta(s)';var max=Math.min(target,200),h='';for(var i=0;i<max;i++)h+='<div class="plantrow"><b>'+(i+1)+'</b><input id="a'+i+'" placeholder="A"><input id="f'+i+'" placeholder="F"><input id="v'+i+'" placeholder="V"><input id="m'+i+'" placeholder="M"></div>';if(target>200)h+='<p class="warn">Amostra grande: exibindo 200 linhas nesta tela universal.</p>';document.getElementById('rows').innerHTML=h}
function gpsEst(){N('requestLocation','estimate')}window.agroLocationResult=function(s){var k=s.indexOf('|'),tag=s.slice(0,k),r=p(s.slice(k+1),{});if(!r.ok)return toast(r.error||'GPS indisponível');if(tag==='estimate'){egps=r;document.getElementById('gpss').innerHTML=r.latitude.toFixed(6)+', '+r.longitude.toFixed(6)+' ±'+Math.round(r.accuracy||0)+'m'}else if(tag==='point')savePointGps(r)};
function saveEst(){var ai=parseInt(document.getElementById('ep').value,10),pr=(D.produtores||[])[ai]||{},total=parseInt(document.getElementById('et').value||'0',10)||0,target=Math.min(total?Math.ceil(total*.10):0,200),rows=[],sum={a:0,f:0,v:0,m:0};for(var i=0;i<target;i++){var r={planta:i+1,antese:+(document.getElementById('a'+i).value||0),fecunda:+(document.getElementById('f'+i).value||0),verde:+(document.getElementById('v'+i).value||0),maduro:+(document.getElementById('m'+i).value||0)};rows.push(r);sum.a+=r.antese;sum.f+=r.fecunda;sum.v+=r.verde;sum.m+=r.maduro}var full={produtor_id:pr.id||null,produtor_nome_informado:pr.nome||'',produtor_cpf_informado:pr.cpf||'',numero_plantas:total,peso_medio_kg:+(document.getElementById('ew').value||0),latitude:egps?egps.latitude:null,longitude:egps?egps.longitude:null,plantas:rows,observacoes:document.getElementById('eo').value||'',data_levantamento:new Date().toISOString().slice(0,10)};var point={produtor_id:pr.id||null,nome_produtor:pr.nome||'',cpf_produtor:pr.cpf||'',latitude:egps?egps.latitude:null,longitude:egps?egps.longitude:null,capturado_em:new Date().toISOString().replace('T',' ').slice(0,19),observacao:'ESTIMATIVA_OFFLINE '+JSON.stringify(full),tipo_registro:'ESTIMATIVA'};if(!point.nome_produtor)return toast('Selecione o produtor.');if(!egps)return toast('Capture o GPS da estimativa.');var rr=p(N('queueOperation','ponto.create',JSON.stringify(point),'[]'),{});toast(rr.message||rr.error||'Salvo');reload();home()}
function point(){reload();var opts='<option value="">Selecione</option>',a=D.produtores||[];for(var i=0;i<a.length;i++)opts+='<option value="'+i+'">'+esc(a[i].nome||'Produtor')+'</option>';document.getElementById('main').innerHTML='<div class="title">Registrar ponto de campo</div><div class="card"><label class="field"><span>Produtor</span><select id="pp">'+opts+'</select></label><label class="field"><span>Observação</span><textarea id="po"></textarea></label><button class="btn full" onclick="N(\'requestLocation\',\'point\')">Capturar GPS e salvar offline</button></div>'}function savePointGps(g){var ai=parseInt(document.getElementById('pp').value,10),pr=(D.produtores||[])[ai]||{};if(!pr.nome)return toast('Selecione o produtor.');var x={produtor_id:pr.id||null,nome_produtor:pr.nome,cpf_produtor:pr.cpf||'',latitude:g.latitude,longitude:g.longitude,precisao_metros:g.accuracy||null,capturado_em:new Date().toISOString().replace('T',' ').slice(0,19),observacao:document.getElementById('po').value||''};var r=p(N('queueOperation','ponto.create',JSON.stringify(x),'[]'),{});toast(r.message||r.error);home()}
function approvals(){reload();var a=(D.aprovacoes_programacoes||[]),c=(D.checklists_pendentes||[]),h='<div class="title">Aprovações pendentes</div>';for(var i=0;i<a.length;i++)h+='<div class="row manager"><b>Programação · '+esc(a[i].tecnico_nome||'')+'</b><small>'+br(a[i].data_programada)+' · '+esc(a[i].atividade_nome||'')+'</small></div>';for(i=0;i<c.length;i++)h+='<div class="row manager"><b>Checklist · '+esc(c[i].placa||c[i].veiculo_modelo||'')+'</b><small>'+esc(c[i].usuario_nome||'')+' · '+esc(c[i].status_aprovacao||'PENDENTE')+'</small></div>';document.getElementById('main').innerHTML=h+(a.length+c.length?'':'<div class="card muted">Nada pendente na base local.</div>')}
function team(){reload();var a=D.equipe||[],h='<div class="title">Equipe disponível no aparelho</div>';for(var i=0;i<a.length;i++)h+='<div class="row"><b>'+esc(a[i].nome||'')+'</b><small>'+esc(a[i].perfil_nome||a[i].perfil_codigo||'')+' · '+esc(a[i].matricula||'')+'</small></div>';document.getElementById('main').innerHTML=h}
function sync(){reload();var h='<div class="title">Sincronização</div><div class="card"><b>'+(S.pending||0)+' registro(s) aguardando</b><p class="muted">Primeiro envia a fila local; depois baixa novamente produtores, plantios, programação, equipe, veículos, pontos e aprovações.</p><button class="btn full" onclick="syncNow()">↻ Sincronizar agora</button><button class="btn alt full" style="margin-top:8px" onclick="refresh()">Somente baixar dados</button></div><div class="title">Fila local</div>';for(var i=0;i<Q.length;i++)h+='<div class="row"><b>'+esc(Q[i].type||'Registro')+'</b><small>'+esc(Q[i].status||'PENDING')+(Q[i].last_error?' · '+esc(Q[i].last_error):'')+'</small></div>';document.getElementById('main').innerHTML=h}function syncNow(){if(!S.online)return toast('Sem internet. Os dados continuam salvos no aparelho.');toast('Sincronizando...');N('syncNow')}
reload();if(S.authenticated)home();
</script></body></html>
