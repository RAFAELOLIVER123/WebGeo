plugins { id 'com.android.application' }

android {
    namespace 'com.agrodominium.mobile.v3'
    compileSdk 35

    defaultConfig {
        applicationId 'com.agrodominium.mobile.v3'
        minSdk 21
        targetSdk 35
        versionCode 301
        versionName '3.0.1-universal'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
